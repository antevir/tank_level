[platformio]
src_dir = src
default_envs = esp

[env]
platform = espressif8266
framework = arduino
board = d1_mini
monitor_speed = 115200

lib_extra_dirs = ../common

build_flags =
  -Isrc
  -I../common/cfg/
  -I../common/src/

build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>

; Original build: button-only (pump remote control)
[env:esp]
build_flags =
  ${env.build_flags}

upload_protocol = espota
upload_port = tank_button.local
#upload_port = COM3

; Nightlight build: button + photo resistor + 2-ch PWM night light + web UI
[env:esp_nightlight]
build_flags =
  ${env.build_flags}
  -DFEATURE_NIGHTLIGHT

#upload_protocol = espota
#upload_port = tank_nightlight.local
upload_port = COM3
