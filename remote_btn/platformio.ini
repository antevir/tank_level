[platformio]
src_dir = src
default_envs = esp

[env]
platform = espressif8266
framework = arduino
board = d1_mini
monitor_speed = 115200

lib_extra_dirs = ../common

build_flags =
  -Isrc
  -I../common/cfg/
  -I../common/src/

build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>

[env:esp]
build_flags =
  ${env.build_flags}

#upload_protocol = espota
#upload_port = tank_button.local
upload_port = COM3