[platformio]
src_dir = src
default_envs = esp

[env]
platform = espressif8266
framework = arduino
board = d1_mini
monitor_speed = 115200

lib_extra_dirs = ../common

build_flags =
  -Isrc
  -I../common/cfg/
  -I../common/src/

build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>

; Original build: button-only (pump remote control)
[env:esp]
build_flags =
  ${env.build_flags}

upload_protocol = espota
upload_port = tank_button.local
#upload_port = COM3

; Greenhouse build: button + light sensor + lamp + moisture sensor + irrigation + web UI
[env:esp_greenhouse]
platform = espressif32@54.3.20
board = lolin_s2_mini
build_flags =
  ${env.build_flags}
  -DFEATURE_GREENHOUSE

upload_protocol = espota

upload_port = tank_greenhouse.local
#upload_port = COM4
