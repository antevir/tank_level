[platformio]
src_dir = src
default_envs = esp

[env]
framework = arduino
monitor_speed = 115200

lib_deps =
  luisllamasbinaburo/MeanFilterLib@^1.0.0
  luisllamasbinaburo/MedianFilterLib@^1.0.1
  wizard97/RingBufCPP@^1.3
  paulstoffregen/Time@^1.6.1
  arduino-libraries/NTPClient@^3.2.1

lib_extra_dirs = ../common

build_flags =
  -Isrc
  -I../common/cfg/
  -I../common/src/

build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>

[env:esp]
platform = espressif8266
board = d1_mini
build_flags =
  ${env.build_flags}

upload_protocol = espota
#upload_port = tank.local
upload_port = 192.168.0.216
#upload_port = COM5

[env:s2]
platform = espressif32@54.3.20
board = lolin_s2_mini
build_flags =
  ${env.build_flags}
  -DLOG_USE_SERIAL
upload_protocol = espota
upload_port = tank.local
#upload_port = COM4
monitor_port = COM5
monitor_speed = 115200